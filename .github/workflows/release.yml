# Release pipeline: one tag builds every artifact NatPilot ships.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Jobs
#   frontend  builds the SPA once and shares it as an artifact (go:embed input)
#   binaries  matrix of GOOS/GOARCH  → natpilot-<os>-<arch>[.exe]
#   docker    multi-arch manifest     → ghcr.io/<owner>/natpilot:<ver> + :latest
#   desktop   matrix of OS runners    → NSIS / dmg / AppImage installers
#
# Everything is CGO-free (pure-Go SQLite), so no job needs a C toolchain.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (defaults to the tag or 0.0.0-dev)'
        required: false

env:
  # Single source of truth for the version: the tag, or a manual input.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- frontend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      # vite clears its output directory, which removes the placeholder file that
      # go:embed needs on a fresh clone. Put it back before anything compiles Go.
      - name: Restore embed placeholder
        run: git checkout -- internal/webui/dist/placeholder.html || true

      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          retention-days: 3

  # ---------------------------------------------------------------- binaries
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          suffix="$GOOS-$GOARCH"
          [ -n "$GOARM" ] && suffix="$suffix-v$GOARM"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION#v} -X main.commit=${GITHUB_SHA::7} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "out/natpilot-${suffix}${ext}" .
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: natpilot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: out/*
          retention-days: 7

  # ------------------------------------------------------------ docker image
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU is only needed for the alpine runtime stage of non-native arches;
      # the Go/frontend stages run on the build platform and cross-compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/natpilot
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ env.VERSION }}

      - name: Build and push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- desktop
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win }
          - { os: macos-latest, script: dist:mac }
          - { os: ubuntu-latest, script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist

      # The Electron shell bundles this binary via extraResources (../bin).
      - name: Build server binary
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; else ext=""; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION#v} -X main.commit=${GITHUB_SHA::7}" \
            -o "bin/natpilot${ext}" .

      - name: Package desktop app
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------ publish
  publish:
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: natpilot-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts-desktop
          pattern: desktop-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            artifacts-desktop/*
          generate_release_notes: true
          fail_on_unmatched_files: false
